name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run self-check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          EXTERNA_API_URL: http://example.test
          EXTERNA_COLLECTION:
