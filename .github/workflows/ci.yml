name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-matrix:
    name: build-matrix (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run self-check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          EXTERNA_API_URL: http://example.test
          EXTERNA_COLLECTION:
  
  build:
    name: build
    runs-on: ubuntu-latest
    needs: build-matrix
    if: always()
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.build-matrix.result }}" != "success" ]; then
            echo "Matrix build failed"
            exit 1
          fi
