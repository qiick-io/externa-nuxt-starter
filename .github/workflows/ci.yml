name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-matrix:
    name: build-matrix (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.22.3', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run self-check
      - run: npm run typecheck
      - run: npm run lint
      # Chrome's legacy-scan, ratcheted against legacy-scan-baseline.json (no findings
      # today). A step in this job and not a job of its own: GitHub bills per job,
      # rounded up to the whole minute. The scan does not depend on the Node version,
      # so it runs on one leg of the matrix only.
      - run: npm run lint:legacy
        if: matrix.node-version == '24'
      - run: npm run build
        env:
          EXTERNA_API_URL: http://example.test
          EXTERNA_COLLECTION:
  
  build:
    name: build
    runs-on: ubuntu-latest
    needs: build-matrix
    if: always()
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.build-matrix.result }}" != "success" ]; then
            echo "Matrix build failed"
            exit 1
          fi
